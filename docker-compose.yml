x-default-build-args: &default-build-args
  TZ: "${TZ}"

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "1G"
    max-file: "1"
    compress: "false"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        <<: *default-build-args
    env_file:
      - .env
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - bgutil-provider
      - mongo
    volumes:
      - .:/app

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "4416"

  # Private MongoDB for this bot only (no port published; other bots on the server are not affected)
  mongo:
    image: mongo:7
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - mongo-data:/data/db

  # Optional Cloudflare WARP (free) for YouTube only, when YouTube blocks the server IP.
  # Start: docker compose --profile warp up -d   +   YOUTUBE_PROXY=socks5://warp:1080 in .env
  warp:
    image: caomingjun/warp:latest
    profiles: ["warp"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      - WARP_SLEEP=2
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    device_cgroup_rules:
      - 'c 10:200 rwm'
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - warp-data:/var/lib/cloudflare-warp

volumes:
  mongo-data:
  warp-data:
